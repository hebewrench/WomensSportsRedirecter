<!DOCTYPE html>
<html>
  <head>
    <title>Sports Search Redirect</title>
    <script src="popup.js"></script>
    <script type="text/javascript" src="lib/node_modules/@emailjs/browser/dist/email.min.js"></script>
  </head>
  <body>
    <h1>Sports Terms Redirecting</h1>
    
    <div id="sportsTerms" style="white-space: pre-wrap; border: 1px solid #ddd; padding: 10px; width: 300px; height: 200px; overflow-y: auto;"></div>
    <p></p>
    <button id="reload">Reload to Women's Sports</button>

    <h2>Suggest a New Term</h2>
    <input type="text" id="suggestionInput" placeholder="Enter a new sports term" />
    <button id="submitSuggestion">Submit Suggestion</button>
    
    <div id="suggestionMessage" style="color: green; margin-top: 10px;"></div>
    

  </body>
</html>
